---
# title: Lint workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-06-11
# keywords: [infrastructure, linting]
# comment: |
#   Lints the repository on pull requests against main:
#     - repo-lint    : actionlint (.github/workflows/*, incl. shellcheck
#                      on run: steps), yamllint (.yamllint.yml),
#                      markdownlint (.markdownlint.yml) and hadolint
#                      (.github/docker/texlive/Dockerfile) via the
#                      reusable stklug84/github-workflows repo-lint
#                      workflow
#     - cv-schema    : validate each data/cv*.yml against cv/parse schema
# ---
name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # actionlint (incl. shellcheck over run: blocks), yamllint,
  # markdownlint and hadolint come from the shared catalog. The
  # discover-sources / cv-schema pair below is the check unique to this
  # repository.
  repo-lint:
    uses: stklug84/github-workflows/.github/workflows/repo-lint.yml@ef0b2e5ae729ef22d91331095281856a97b4dbd5  # v2.0.0
    with:
      hadolint-dockerfile: ".github/docker/texlive/Dockerfile"

  # Discover every CV data source present in the checkout and pair it
  # with every registered LaTeX style from the data/variants.yml
  # registry. The matrix is built at runtime from data/cv*.yml plus the
  # registry rather than hardcoded, so:
  #   - the remote (which may carry no committed CV data) lints just what
  #     exists and never fails on a missing source,
  #   - gitignored overlays (data/*.local.yml) are excluded from the glob
  #     (cv/parse deep-merges them automatically when present), and
  #   - validation is STYLE-AWARE: cv/parse selects the entries a style
  #     consumes via `targets` (per-style tokens like cv-tagged-ia, or
  #     the generic `latex`) and validates them under the style's schema
  #     profile ('plain' rejects tagged-only fields, 'tagged' accepts
  #     structured certifications, {name, size} skill items, concepts and
  #     lat/lon). Checking every source against every registered style
  #     covers merged multi-style sources; a style with no matching
  #     entries validates the shared meta/contact core only. Sources
  #     present without a registry fall back to the 'plain' profile.
  discover-sources:
    name: discover cv sources
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      has_sources: ${{ steps.find.outputs.has_sources }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Pair data/cv*.yml with schema profiles
        id: find
        run: |
          set -euo pipefail
          # PyYAML ships on hosted runners; local `gh act` images may
          # lack it (mirrors the cv/generate action's on-demand install).
          python3 -c 'import yaml' 2>/dev/null \
            || pip install --user --quiet PyYAML
          matrix="$(python3 <<'PY'
          import glob
          import json
          import os
          import yaml

          registry = {}
          if os.path.exists("data/variants.yml"):
              with open("data/variants.yml", encoding="utf-8") as fh:
                  variants = yaml.safe_load(fh) or {}
              registry = variants.get("styles") or {}

          valid_targets = ",".join(registry)
          pairs = []
          for source in sorted(glob.glob("data/cv*.yml")):
              # *.local.yml overlays are merged into their base source by
              # cv/parse; they are not standalone documents.
              if source.endswith(".local.yml"):
                  continue
              styles = list(registry) or [""]
              pairs += [
                  {
                      "source": source,
                      "style": (registry.get(style, {}) or {})
                      .get("parse_style", "plain"),
                      "target_style": style,
                      "valid_targets": valid_targets,
                  }
                  for style in styles
              ]
          print(json.dumps(pairs, separators=(",", ":")))
          PY
          )"
          echo "Discovered schema checks: ${matrix}"
          if [ "${matrix}" = "[]" ]; then
            echo "has_sources=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_sources=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  cv-schema:
    name: cv-schema (${{ matrix.source }}, ${{ matrix.target_style || matrix.style }})
    needs: discover-sources
    if: needs.discover-sources.outputs.has_sources == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Discovered at runtime by discover-sources; every data/cv*.yml
        # source must satisfy the cv/parse schema contract of every
        # registered style (from data/variants.yml).
        include: ${{ fromJSON(needs.discover-sources.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Validate the source of truth against the cv/parse schema
      # contract; --check writes nothing and fails the PR on the first
      # violation with a clear message. Pinned to actions >= v2.15.0 so
      # the check applies the style-dependent schema profiles PER ENTRY:
      # target-style selects the entries the style consumes (per-style
      # `targets` tokens), valid-targets registers every style name as an
      # accepted token, and the profile ('plain' rejects tagged-only
      # fields; 'tagged' accepts structured certifications, {name, size}
      # skill items, concepts and lat/lon) applies to the selection.
      - name: Validate ${{ matrix.source }} (${{ matrix.target_style || matrix.style }})
        uses: stklug84/actions/cv/parse@fcf81eaf154cfbf73ba88118d5c045dbf5c3815e  # v2.17.0
        with:
          source: ${{ matrix.source }}
          style: ${{ matrix.style }}
          target-style: ${{ matrix.target_style }}
          valid-targets: ${{ matrix.valid_targets }}
          check: "true"
          # out-dir is required by the action but unused in --check mode.
          out-dir: .
