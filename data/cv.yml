      # SMT Process Monitor
      - de: >-
          Aufbau eines SMT-Prozessmonitors, der Daten über den gesamten
          Surface-Mount-Wertstrom integriert und harmonisiert — Lotpastenauftrag,
          Pick-and-Place, Reflow-Löten, automatisierte optische Inspektion (AOI)
          und In-Circuit-Test (ICT) — und Zykluszeitdaten jeder Maschine in einem
          einheitlichen, auf Apache Spark aufgebauten Modell konsolidiert.
          Durch die Korrelation der Daten über
          den gesamten Wertstrom erkennt das System Fehler, die sonst erst bei der
          AOI auffallen würden, bereits beim Lotpastenauftrag, sodass Ingenieure
          das nackte Panel ausschleusen können, bevor teure Bauteile bestückt und
          verlötet werden — Reduktion der Materialausschusskosten um 12%.
        en: >-
          Designed an SMT process monitor that integrates and harmonises data across
          the full surface-mount value stream — solder-paste application,
          pick-and-place, reflow soldering, automated optical inspection (AOI) and
          in-circuit test (ICT) — consolidating cycle-time data from every machine
          into a single unified model on Apache Spark. By correlating data
          along the whole value
          stream, the system flags defects that would only surface at AOI already
          at the solder-paste stage, letting engineers scrap the bare panel before
          expensive components are placed and soldered onto it — reducing material
          scrap cost by 12%.
      # Logistics Forecasting
      - de: >-
          Aufbau eines Bedarfsprognosesystems zur Vorhersage von
          Kundenbestellmengen über mehrere Zeithorizonte (1-, 3- und
          12-Monats-Fenster) sowie zur Modellierung der systematischen
          Prognoseverzerrung je Kunde — empirisches Lernen, wo Kunden ihren
          künftigen Bedarf über- oder unterschätzen — um Produktionsvolumina
          genauer zu planen und Materialbestellungen bei Lieferanten optimal
          auszusteuern, bei niedrigen Beständen und einer um 60% verbesserten
          Bedarfsprognosegenauigkeit sowie um 15% reduzierten Bestandskosten.
        en: >-
          Built a demand-forecasting system predicting customer order volumes
          across multiple horizons (1-, 3- and 12-month windows) and modelling
          each customer's systematic forecast bias — learning empirically where
          customers over- or under-estimate future demand — to plan production
          volumes more accurately and optimise supplier material orders, keeping
          inventories low while improving demand-forecast accuracy by
          60% and reducing inventory costs by 15%.

