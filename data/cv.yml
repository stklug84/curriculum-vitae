# data/cv.yml — canonical, bilingual single source of truth for the CV.
#
# Consumed by stklug84/actions cv/parse (v2), which emits per-section
# .tex files for each LaTeX variant declared in data/variants.yml and a
# skcloud-schema cv.yml for the web. See data/README.md for the schema
# and the `targets` contract.
#
# Conventions:
#   * Bilingual text fields are {de, en} (both required).
#   * Neutral fields (org, year, monogram, paths, ...) are scalars.
#   * `targets` selects consumers PER ENTRY. This is a merged,
#     multi-style source: instead of the generic `latex` token, every
#     LaTeX-bound entry names the presentation style(s) it feeds —
#     `cv-tagged-ia` (Databricks/industry variant, tagged profile) or
#     `cv-plain-style` (academic variant, plain profile) — plus `web`
#     for the skcloud emitter. Absent => [latex, web].
#   * The top-level `overrides.<style>` block carries per-style
#     meta/contact deltas, deep-merged over the base for that style.
#   * The gitignored sibling data/cv.local.yml overlay carries the
#     local-only PII contact fields (birthdate, address, ...) consumed
#     by the cv-plain-style variant; it is deep-merged over this file
#     when present (local builds only, never committed).

meta:
  display_name: Steffen Klug
  author: Dr. rer. nat. Steffen Klug
  pdf_author: Dr. rer. nat. Steffen Klug
  lang_default: de
  title:
    de: Data & AI Engineer und Lösungsarchitekt
    en: Data & AI Engineer & Solutions Architect
  # PDF metadata document title (\cvtitle -> pdftitle). Bilingual so the
  # German variant keeps "Lebenslauf" while English variants read
  # "Curriculum Vitae". Absent, cv/parse defaults to "Lebenslauf".
  pdf_title:
    de: Lebenslauf
    en: Curriculum Vitae
  location:
    de: Stuttgart, Deutschland
    en: Stuttgart, Germany
  summary:
    de: >-
      Promovierter Physiker, der mit Begeisterung produktionsreife verteilte
      Data-Engineering- und Analyseplattformen auf Basis von Apache
      Spark/Kafka/Flink und dem Databricks Lakehouse (PySpark, Scala, Python)
      sowie cloud-native AI/ML-Systeme (primär Azure, AWS/GCP vertraut)
      konzipiert, aufbaut und liefert. Agiert als vertrauenswürdiger
      technischer Berater für funktionsübergreifende Teams in Europa,
      Nordamerika und Asien und bringt Data-Engineering-, MLOps- und
      CI/CD-Disziplin ein, um Datenpipelines und Analytics-Lösungen im großen
      Maßstab zu industrialisieren. Praktische Stärken in GenAI — RAG,
      Multi-Agenten-Systeme und Evaluation — ergänzt durch semantische Daten,
      erklärbare KI und Knowledge Graphs, um agentische Lösungen mit
      messbarem geschäftlichem Mehrwert auszuliefern.
    en: >-
      PhD physicist who loves to design, build and deliver production-grade
      distributed data engineering and analytics platforms on the Databricks
      Lakehouse (PySpark, Scala) and cloud-native AI/ML systems (Azure primary,
      AWS/GCP aware). Acts as a trusted technical advisor to cross-functional
      teams across Europe, North America and Asia, bringing data engineering,
      MLOps and CI/CD discipline to productionise data pipelines and analytics
      at scale. Hands-on strengths in GenAI — RAG, multi-agent systems and
      evaluation — alongside semantic data, explainable AI and knowledge
      graphs, to ship agentic solutions that deliver measurable business value.

