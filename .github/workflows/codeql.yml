---
# title: CodeQL workflow
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-06-11
# keywords: [infrastructure, security]
# comment: |
#   CodeQL code scanning for the `actions` language, which analyzes
#   .github/workflows/* (expression injection, excessive permissions,
#   untrusted checkout, artifact/cache poisoning, ...). The
#   security-extended suite adds the unpinned-tag query. Bash run:
#   blocks are not a CodeQL language and are covered by the embedded
#   shellcheck of actionlint in the Lint workflow instead.
# ---
name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly run to pick up newly released queries.
    - cron: '45 5 * * 1'

permissions:
  contents: read

jobs:
  # A reusable-workflow path plus a 40-character SHA cannot fit in 120
  # columns; the trailing version comment stays because that is the form
  # Dependabot reads and rewrites.
  # yamllint disable-line rule:line-length
  codeql:
    uses: stklug84/github-workflows/.github/workflows/repo-codeql.yml@e8b7009127c21bd66249ad5df0a0112c1d4f6553  # v4.0.0
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      languages: '["actions"]'
